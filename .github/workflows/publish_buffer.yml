name: Publish to Instagram via Buffer

on:
  schedule:
    # 12:00 PM ET
    - cron: '0 17 * * *'
    # 8:00 PM ET
    - cron: '0 1 * * *'
    # Thu 8:30 AM ET
    - cron: '30 13 * * 4'
    # Fri 7:00 PM ET (00:00 UTC Sat)
    - cron: '0 0 * * 6'
    # Sat 11:00 AM ET
    - cron: '0 16 * * 6'
    # Sun 8:30 PM ET (01:30 UTC Mon)
    - cron: '30 1 * * 1'
    # Wed Dec 2 6:00 PM ET
    - cron: '0 23 * * 3'
  push:
    paths:
      - '.github/workflows/publish_buffer.yml'
      - 'staging/manifest_*.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode or fetch staged images and commit to docs/images
        run: |
          python - <<'EOF'
          import base64, glob, json, os, shutil, requests

          os.makedirs('staging', exist_ok=True)
          os.makedirs('docs/images', exist_ok=True)

          for b64_path in glob.glob('staging/**/*.b64', recursive=True):
              out_name = os.path.basename(b64_path)[:-4]
              raw = open(b64_path, 'r', encoding='utf-8').read().strip()
              data = base64.b64decode(raw)
              with open(os.path.join(os.path.dirname(b64_path), out_name), 'wb') as out_f:
                  out_f.write(data)
              with open(os.path.join('docs/images', out_name), 'wb') as doc_f:
                  doc_f.write(data)

          for manifest_path in glob.glob('staging/**/manifest_*.json', recursive=True):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m = json.load(f)
              img_name = m.get('image_filename')
              dl_url = m.get('image_direct_download_url')
              target_staging = os.path.join(os.path.dirname(manifest_path), img_name) if img_name else None
              if img_name and dl_url and target_staging and not os.path.exists(target_staging):
                  resp = requests.get(dl_url, allow_redirects=True, timeout=30)
                  if resp.ok and resp.content:
                      with open(target_staging, 'wb') as img_f:
                          img_f.write(resp.content)

          for img in glob.glob('staging/**/*.jpg', recursive=True) + glob.glob('staging/**/*.png', recursive=True):
              shutil.copyfile(img, os.path.join('docs/images', os.path.basename(img)))
          EOF
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/
          git commit -m "Stage images for Buffer [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/publish_from_gdrive.py

      - name: Commit published ledger
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json
          git commit -m "Record published post in ledger [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
