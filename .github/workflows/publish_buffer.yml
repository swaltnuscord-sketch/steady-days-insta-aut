name: Publish to Instagram via Buffer

on:
  schedule:
    # 12:00 PM ET
    - cron: '0 17 * * *'
    # 8:00 PM ET
    - cron: '0 1 * * *'
    # Thu 8:30 AM ET
    - cron: '30 13 * * 4'
    # Fri 7:00 PM ET (00:00 UTC Sat)
    - cron: '0 0 * * 6'
    # Sat 11:00 AM ET
    - cron: '0 16 * * 6'
    # Sun 8:30 PM ET (01:30 UTC Mon)
    - cron: '30 1 * * 1'
    # Wed Dec 2 6:00 PM ET
    - cron: '0 23 * * 3'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download from Drive and commit images to GitHub
        run: |
          python -c "
          import sys, subprocess, glob, os, shutil
          os.makedirs('staging', exist_ok=True)
          subprocess.run([sys.executable, '-m', 'gdown', '--folder', 'https://drive.google.com/drive/folders/1i5pSM8yPiWII02c6af3tD5tJSRs44Z_C', '-O', 'staging/'], check=True)
          os.makedirs('docs/images', exist_ok=True)
          for img in glob.glob('staging/**/*.jpg', recursive=True) + glob.glob('staging/**/*.png', recursive=True):
              shutil.copyfile(img, os.path.join('docs/images', os.path.basename(img)))
          "
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/
          git commit -m "Stage images for Buffer [skip ci]" || echo "No changes to commit"
          git push

      - name: Post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/publish_from_gdrive.py

      - name: Commit published ledger
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json
          git commit -m "Record published post in ledger [skip ci]" || echo "No changes to commit"
          git push
