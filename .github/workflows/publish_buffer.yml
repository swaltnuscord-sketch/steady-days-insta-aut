name: Publish to Instagram via Buffer

on:
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download from Drive and commit image to GitHub
        run: |
          python -c "
          import sys, subprocess, glob, os, shutil
          os.makedirs('staging', exist_ok=True)
          subprocess.run([sys.executable, '-m', 'gdown', '--folder', 'https://drive.google.com/drive/folders/1i5pSM8yPiWII02c6af3tD5tJSRs44Z_C', '-O', 'staging/'], check=True)
          os.makedirs('docs/images', exist_ok=True)
          imgs = glob.glob('staging/**/*.jpg', recursive=True) + glob.glob('staging/**/*.png', recursive=True)
          if imgs:
              shutil.copyfile(imgs[0], os.path.join('docs/images', os.path.basename(imgs[0])))
          "
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/
          git commit -m "Stage image for Buffer [skip ci]" || echo "No changes to commit"
          git push

      - name: Post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: python scripts/publish_from_gdrive.py
