name: Publish to Instagram via Buffer

on:
  schedule:
    # 12:00 PM ET (17:00 UTC)
    - cron: '0 17 * * *'
    # 8:00 PM ET (01:00 UTC next day)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull from Google Drive & Post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: python scripts/publish_from_gdrive.py

      - name: Commit image to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/
          git commit -m "Auto-stage published Instagram assets [skip ci]" || echo "No changes to commit"
          git push
